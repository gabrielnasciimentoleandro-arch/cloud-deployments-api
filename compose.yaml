services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-deploy-api:local
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "true"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
